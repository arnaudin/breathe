# Copy this app into the personal site repo whenever it changes, so
# ryanarnaudin.com/sites/breathe/ never drifts from the source.
#
# Breathe is two files: index.html and the fonts.css bundle it loads from beside
# itself. Both are synced together; the page alone would render unstyled.
#
# SETUP (one time):
#   1. Create a fine-grained personal access token:
#        GitHub -> Settings -> Developer settings -> Personal access tokens ->
#        Fine-grained tokens -> Generate new token
#      Scope it as narrowly as it goes:
#        Repository access : Only select repositories -> arnaudin/arnaudin.github.io
#        Permissions       : Repository permissions -> Contents -> Read and write
#      Contents write is the only permission this workflow needs. The same token
#      already used by the tea-timer repo works here; it is not per-repo.
#   2. In THIS repo: Settings -> Secrets and variables -> Actions ->
#      New repository secret, named SITE_REPO_TOKEN, with that token as the value.
#   3. First run: DRY_RUN below is "true", so the job prints the diff and pushes
#      nothing. Trigger it from the Actions tab with Run workflow, read the
#      "What would change" step, and confirm it touches only sites/breathe/.
#      Then set DRY_RUN to "false" and commit that.
#
# Pushing with a PAT rather than the built-in GITHUB_TOKEN means the site repo's
# own build-and-deploy workflow DOES fire on the resulting commit, so the change
# reaches Namecheap without another click. That workflow never pushes back, so
# there is no loop.
name: Sync Breathe to the site

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "fonts.css"
  workflow_dispatch:

# This job reads this repo with the default token and writes the site repo with
# the PAT, so no elevated default permissions are needed here.
permissions:
  contents: read

# Never let two syncs race to push the same files.
concurrency:
  group: "sync-breathe"
  cancel-in-progress: false

env:
  # Flip to "false" once a dry run looks right.
  DRY_RUN: "false"
  SITE_REPO: "arnaudin/arnaudin.github.io"
  DEST_DIR: "sites/breathe"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the app
        uses: actions/checkout@v7
        with:
          path: app

      - name: Check out the site
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SITE_REPO }}
          token: ${{ secrets.SITE_REPO_TOKEN }}
          path: site

      - name: Stamp the header and write the copies
        id: copy
        run: |
          python3 app/.github/scripts/sync_breathe.py \
            "app" \
            "site/${DEST_DIR}" \
            "$(git -C app rev-parse --short HEAD)"

      - name: What would change
        working-directory: site
        run: |
          if [ "${{ steps.copy.outputs.changed }}" != "true" ]; then
            echo "The site copy already matches the source. Nothing to do."
            exit 0
          fi
          echo "Files touched:"
          git status --short
          echo
          echo "Diff (fonts.css is a base64 bundle, so only its stat is shown):"
          git --no-pager diff --stat -- "${DEST_DIR}"
          git --no-pager diff -- "${DEST_DIR}/index.html"
          echo
          # The checkout is clean, so only files under DEST_DIR may differ.
          # Anything outside it means the script wrote somewhere unexpected.
          stray="$(git status --porcelain | awk '{print $2}' | grep -v "^${DEST_DIR}/" || true)"
          if [ -n "$stray" ]; then
            echo "::error::Expected only ${DEST_DIR}/ to change, also got: ${stray}"
            exit 1
          fi

      - name: Commit and push
        if: steps.copy.outputs.changed == 'true' && env.DRY_RUN == 'false'
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${DEST_DIR}"
          git commit -m "Sync Breathe from breathe@$(git -C ../app rev-parse --short HEAD)"
          git push

      - name: Dry run notice
        if: steps.copy.outputs.changed == 'true' && env.DRY_RUN != 'false'
        run: |
          echo "::notice::DRY_RUN is true, so nothing was pushed. Set DRY_RUN to \"false\" in this workflow to go live."
